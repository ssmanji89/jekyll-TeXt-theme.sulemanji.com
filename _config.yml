# Site Settings
title: Suleman S. Manji | Business Process Automation Expert
description: >
  Business Process Automation Specialist with expertise in Microsoft 365, 
  cloud services, and AI-driven process improvements.
url: "https://www.sulemanji.com"
baseurl: ""

# Build Settings
markdown: kramdown
theme: jekyll-text-theme

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

# Conversion
highlighter: rouge
incremental: false

# Serving
detach: false

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: "/blog/page:num/"

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: laquo,raquo,bdquo,rdquo
  syntax_highlighter: rouge

# Default Front Matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      comments: false
      author_profile: true
      sidebar:
        nav: "main"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - docker
  - README.md
  - HOW_TO_RELEASE.md
  - .travis.yml
  - .eslintrc
  - .editorconfig
  - .commitlintrc.js

# Custom Configuration
image_cdn: https://cdn.sulemanji.com
