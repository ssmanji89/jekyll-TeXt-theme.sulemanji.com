# Site Settings
title: Suleman S. Manji
description: >
  Business Process Automation Specialist with expertise in Microsoft 365,
  cloud services, and AI-driven process improvements.
url: "https://www.sulemanji.com"
baseurl: ""

# Theme Settings
theme: jekyll-text-theme
remote_theme: kitian616/jekyll-TeXt-theme

# Build Settings
markdown: kramdown
highlighter: rouge

# Conversion
incremental: false

# Serving
detach: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jemoji

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: laquo,raquo,bdquo,rdquo
  syntax_highlighter: rouge

# Default Front Matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: false
      sidebar:
        nav: "main"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Theme Specific Configuration
text_skin: default
highlight_theme: default
lang: en
timezone: America/Chicago

# Author
author:
  name: Suleman S. Manji
  email: ssmanji89@gmail.com
  links:
    - label: LinkedIn
      icon: fab fa-linkedin
      url: https://www.linkedin.com/in/sulemanmanji
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/ssmanji89

# CDN and Performance
image_cdn: https://cdn.sulemanji.com
