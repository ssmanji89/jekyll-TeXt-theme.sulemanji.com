  </button>
</div>

<style>
.theme-toggle-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
}

.theme-toggle {
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.theme-toggle-icon {
  display: none;
}

body.dark-mode .dark-icon {

</style>
